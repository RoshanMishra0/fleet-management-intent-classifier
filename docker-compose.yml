# Starts Ollama and the API. Pull the model once after the first start:
#   docker compose exec ollama ollama pull qwen2.5:3b
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # For an NVIDIA GPU, uncomment (needs the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL_NAME: qwen2.5:3b
    ports:
      - "8000:8000"
    depends_on:
      - ollama

volumes:
  ollama:
